<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengaturan – Umum</title>
<style>
  :root { --bg:#000; --card:#1c1c1e; --line:#38383a; --label:#fff; --muted:#8e8e93; --blue:#0a84ff; --dur:.34s; }
  * { -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  #app { position:relative; max-width:480px; height:100%; margin:0 auto; overflow:hidden; background:#000; }

  .page { --bar-h:calc(64px + env(safe-area-inset-top,0px)); position:absolute; inset:0; overflow:hidden; background:#000;
    transform:translateX(100%); visibility:hidden; touch-action:pan-y; will-change:transform;
    transition:transform var(--dur) cubic-bezier(.32,.72,0,1), visibility 0s linear var(--dur); }
  .page.active  { transform:none; visibility:visible; transition-delay:0s; }
  .page.behind  { transform:translateX(-28%); visibility:visible; transition-delay:0s; pointer-events:none; }
  .page.deep    { transform:translateX(-28%); }
  .page.dragging{ visibility:visible; transition:none; }
  .scroll > .content { min-height:calc(100% + 1px); }
  .page.sweep { border-radius:44px 0 0 44px; box-shadow:-10px 0 40px rgba(0,0,0,.6); }

  .note { color:var(--muted); font-size:15px; line-height:1.35; margin:-14px 16px 28px; }
  .note a { color:var(--blue); text-decoration:none; }

  .bar { position:absolute; top:0; left:0; right:0; z-index:50; height:var(--bar-h); box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top,0px) 16px 0;
    background:none; pointer-events:none; }
  .bar .back { pointer-events:auto; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;
    padding:calc(var(--bar-h) + 24px) 16px calc(40px + env(safe-area-inset-bottom,0px));
    -webkit-mask-image:linear-gradient(to bottom, transparent calc(var(--bar-h) - 28px), black calc(var(--bar-h) + 20px));
    mask-image:linear-gradient(to bottom, transparent calc(var(--bar-h) - 28px), black calc(var(--bar-h) + 20px)); }
  .bar h1 { font-size:17px; font-weight:600; margin:0; max-width:calc(100% - 120px); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar.left { justify-content:flex-start; padding-right:0; }
  .bar.left h1 { margin-left:57px; max-width:none; overflow:visible; text-overflow:clip; text-align:left; letter-spacing:-.2px; }
  .back { position:absolute; left:16px; top:calc(10px + env(safe-area-inset-top,0px)); width:44px; height:44px; border-radius:50%;
    z-index:2; display:grid; place-items:center; background:#1c1c1e; border:1px solid rgba(255,255,255,.12);
    color:#f2f2f7; cursor:pointer; padding:0; outline:none; touch-action:manipulation; transition:opacity .2s ease; }
  .back:focus, .back:focus-visible { outline:none; box-shadow:none; }
  .back:active, .back.pressed { opacity:.5; transition:none; }
  .row:focus-visible { outline:2px solid var(--blue); outline-offset:-2px; }

  .card { background:var(--card); border-radius:26px; margin-bottom:28px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; width:100%; min-height:52px; padding:0 16px; gap:14px; text-align:left;
    background:none; border:0; color:inherit; font:inherit; font-size:17px; cursor:default; position:relative; box-sizing:border-box; }
  .row.nav { cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; transition:background-color .25s ease; }
  .row.nav:active, .row.nav.pressed { background-color:rgba(255,255,255,.1); transition:none; }
  .row + .row::before { content:""; position:absolute; top:0; right:0; height:1px; background:var(--line); left:16px; }
  .row.has-icon { padding:0 14px; }
  .row.has-icon + .row.has-icon::before { left:56px; }

  /* ---------- Ikon: kotak gelap + ikon milikmu ---------- */
  .ico { flex:none; width:28px; height:28px; border-radius:7px; display:grid; place-items:center; box-sizing:border-box;
    background:linear-gradient(160deg,#2f2f31,#161617); border:1px solid rgba(255,255,255,.14); box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
  .ico img { display:block; width:18px; height:18px; object-fit:contain; }
  .head-card .big img { width:40px; height:40px; }

  .val { margin-left:auto; color:var(--muted); font-size:17px; text-align:right; white-space:nowrap; }
  @media (max-width:380px) { .row { gap:8px; } .val { font-size:16px; } }
  @media (max-width:340px) { .row { font-size:15px; padding:0 12px; } .val { font-size:14px; } }
  .chev { flex:none; width:8px; height:14px; color:#636366; margin-left:2px; }
  .lbl { white-space:nowrap; }
  .link { color:var(--blue); }
  .head-card { padding:20px 20px 22px; }
  .head-card .big { width:60px; height:60px; border-radius:16px; }
  .sec { color:var(--muted); font-size:15px; font-weight:600; margin:0 0 8px 16px; }
  @media (min-width:700px) { body { background:#0b0b0c; } #app { height:min(100%,900px); margin-top:max(0px,calc((100% - 900px)/2)); border-radius:28px; box-shadow:0 0 0 1px #222; } }
  @media (prefers-reduced-motion:reduce) { .page { transition:none; } }
</style>
</head>

    <div class="scroll"><div id="vpnmgmt-list" class="content"></div></div>

    <div class="scroll"><div id="vpn-list" class="content"></div></div>

    <div class="scroll"><div id="cert-list" class="content"></div></div>

</div>

};
const ico = (name, cls) => `<span class="ico ${cls||''}">${ICON_SRC[name] ? `<img src="${ICON_SRC[name]}" alt="">` : ''}</span>`;
const CHEV = `<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>`;

const MAIN = [
  [{t:'Mengenai',i:'phone',go:'about'},{t:'Pembaruan Perangkat Lunak',i:'update'},{t:'Penyimpanan iPhone',i:'storage'}],
  [{t:'AppleCare & Garansi',i:'apple'}],
  [{t:'AirDrop',i:'airdrop'},{t:'AirPlay & Kontinuitas',i:'airplay'},{t:'Gambar dalam Gambar',i:'pip'},
   {t:'Pengambilan Layar',i:'capture'},{t:'CarPlay',i:'carplay'},{t:'NFC',i:'nfc'}],
  [{t:'Bahasa & Wilayah',i:'globe'},{t:'Font',i:'font'},{t:'Isi-Auto & Kata Sandi',i:'key'},{t:'Kamus',i:'book'},
   {t:'Papan Ketik',i:'keyboard'},{t:'Segarkan App di Latar',i:'refresh'},{t:'Tanggal & Waktu',i:'clock'}],
  [{t:'Penyedia TV',i:'tv'}],
  [{t:'Manajemen VPN & Perangkat',i:'gear',go:'vpnmgmt'}],
  [{t:'Legal & Pengatur',i:'legal'}],
  [{t:'Transfer atau Atur Ulang iPhone',i:'reset'}],
  [{t:'Matikan',link:true}]
];

const ABOUT = [
  {rows:[['Nama','iPhone',1],['Versi iOS','26.5',1],['Nama Model','iPhone 15'],['Nomor Model','MTLD3CH/A'],['Nomor Seri','DXW3PQMTYQ']]},
  {rows:[['Perlindungan Berakhir','',1]]},
  {rows:[['Lagu','0'],['Video','226'],['Foto','646'],['Aplikasi','16'],['Kapasitas','128 GB'],['Tersedia','71,66 GB']]},
  {rows:[['Alamat WLAN','0C:6A:C4:C0:8B:0D'],['Bluetooth','0C:6A:C4:D3:37:9D'],['Firmware Modem','3.50.08'],['SEID','',1],['Kunci Operator','Tidak ada pembatasan SIM']]},
  {title:'SIM Depan',rows:[['Jaringan','XL Axiata'],['Operator','XL Axiata 70.0'],['IMEI','35 514638 640770 6'],['ICCID','8962115356001700401']]},
  {title:'SIM Belakang',rows:[['IMEI2','35 514638 640518 9']]},
  {rows:[['Pengaturan Kepercayaan Sertifikat','',1,'cert']]}
];

const $ = (s) => document.querySelector(s);

function renderMain() {
  let html = `<div class="card head-card">${ico('gear','big')}
    <h2 style="font-size:34px;font-weight:700;margin:18px 0 6px;letter-spacing:-.3px">Umum</h2>
    <p style="margin:0;color:var(--muted);font-size:20px;line-height:1.35">Kelola seluruh pengaturan dan preferensi Anda untuk iPhone, seperti pembaruan perangkat lunak, bahasa perangkat, CarPlay, AirDrop, dan lainnya.</p></div>`;
  MAIN.forEach(group => {
    html += '<div class="card">';
    group.forEach(it => {
      if (it.link) { html += `<button class="row nav"><span class="link">${it.t}</span></button>`; return; }
      html += `<button class="row nav has-icon" ${it.go ? `data-go="${it.go}"` : ''}>
        ${ico(it.i)}<span>${it.t}</span><span style="margin-left:auto"></span>${CHEV}</button>`;
    });
    html += '</div>';
  });
  $('#main-list').innerHTML = html;
}

function renderAbout() {
  $('#about-list').innerHTML = ABOUT.map(g => `
    ${g.title ? `<p class="sec">${g.title}</p>` : ''}
    <div class="card">${g.rows.map(([l,v,nav,to]) =>
      `<div class="row ${nav ? 'nav' : ''}" ${nav ? 'role="button" tabindex="0"' : ''} ${to ? `data-go="${to}"` : ''}>
        <span class="lbl">${l}</span>${v ? `<span class="val">${v}</span>` : ''}${nav ? CHEV.replace('class="chev"', `class="chev" style="margin-left:${v ? 2 : 'auto'}px"`) : ''}
      </div>`).join('')}</div>`).join('');
}

function renderVpn() {
  $('#vpnmgmt-list').innerHTML = `
    <div class="card">
      <button class="row nav has-icon" data-go="vpn">${ico('vpn')}<span>VPN</span>
        <span class="val">Tidak Terhubung</span>${CHEV}</button>
    </div>
    <div class="card"><button class="row nav"><span class="link">Masuk ke Akun Kantor atau Sekolah...</span></button></div>`;
  $('#vpn-list').innerHTML = `
    <div class="card"><button class="row nav"><span class="link">Konfigurasi VPN...</span></button></div>
    <p class="note">VPN dapat diatur untuk mengontrol perutean lalu lintas jaringan tertentu. <a href="#" onclick="return false">Mengenai VPN &amp; Privasi...</a></p>`;
}

function renderCert() {
  $('#cert-list').innerHTML = `
    <div class="card">
      <div class="row"><span class="lbl">Versi Stok Sertifikat</span><span class="val">2026040100</span></div>
      <div class="row"><span class="lbl">Versi Aset Kepercayaan</span><span class="val">1013</span></div>
    </div>
    <p class="note" style="margin-top:-20px"><a href="#" onclick="return false">Pelajari sertifikat tepercaya lebih lanjut</a></p>`;
}

/* ---------- Navigasi ---------- */
const stack = ['main'];
const pageEl = (n) => $('#page-' + n);
function sync() {
  const last = stack.length - 1;
  document.querySelectorAll('.page').forEach(p => {
    const i = stack.indexOf(p.id.replace('page-', ''));
    p.classList.toggle('active', i === last);
    p.classList.toggle('behind', i > -1 && i === last - 1);
    p.classList.toggle('deep', i > -1 && i < last - 1);
  });
}
function go(name) {
  const el = pageEl(name);
  if (!el || stack.includes(name)) return;
  el.querySelector('.scroll').scrollTop = 0;
  stack.push(name);
  sync();
}
function back() { if (stack.length < 2) return; stack.pop(); sync(); }

let suppressClick = false;
document.addEventListener('click', (e) => {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); return; }
  const item = e.target.closest('[data-go]');
  if (item) { go(item.dataset.go); return; }
  if (e.target.closest('[data-back]')) back();
}, true);

/* ---------- Geser dari tepi kiri untuk kembali ---------- */
(function () {
  const app = $('#app');
  const EDGE = 40;
  let d = null;
  app.addEventListener('pointerdown', (e) => {
    if (stack.length < 2 || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const r = app.getBoundingClientRect();
    d = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), dx: 0, on: false, w: r.width,
          top: pageEl(stack[stack.length - 1]), prev: pageEl(stack[stack.length - 2]) };
  });
  document.addEventListener('pointermove', (e) => {
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { d = null; return; }
      if (dx < -10) { d = null; return; }
      if (dx < 8) return;
      d.on = true;
      [d.top, d.prev].forEach(p => { p.classList.add('dragging'); p.style.transition = 'none'; });
      d.top.classList.add('sweep');
      try { app.setPointerCapture(e.pointerId); } catch (_) {}
    }
    d.dx = Math.max(0, Math.min(dx, d.w));
    const prog = d.dx / d.w;
    d.top.style.transform = `translateX(${d.dx}px)`;
    d.prev.style.transform = `translateX(${-28 * (1 - prog)}%)`;
    e.preventDefault();
  }, { passive: false });
  function end(e) {
    if (!d || e.pointerId !== d.id) return;
    const s = d; d = null;
    if (!s.on) return;
    const v = s.dx / Math.max(1, performance.now() - s.t0);
    const done = e.type !== 'pointercancel' && (s.dx > s.w * 0.4 || (v > 0.5 && s.dx > 20));
    [s.top, s.prev].forEach(p => { p.style.transition = ''; p.style.transform = ''; p.classList.remove('dragging'); });
    setTimeout(() => s.top.classList.remove('sweep'), 380);
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
    if (done) back();
  }
  ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, end, true));
})();

/* ---------- Efek sentuh ---------- */
(function () {
  const MIN_MS = 90;
  let el = null, t0 = 0;
  const release = () => {
    if (!el) return;
    const target = el; el = null;
    setTimeout(() => target.classList.remove('pressed'), Math.max(0, MIN_MS - (performance.now() - t0)));
  };
  document.addEventListener('pointerdown', (e) => {
    const row = e.target.closest('.row.nav, .back');
    if (!row) return;
    el = row; t0 = performance.now(); row.classList.add('pressed');
  });
  ['pointerup', 'pointercancel', 'pointerleave', 'dragend'].forEach(ev => document.addEventListener(ev, release, true));
})();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') back();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-go]')) { e.preventDefault(); go(e.target.dataset.go); }
});

renderMain(); renderAbout(); renderVpn(); renderCert();
</script>
